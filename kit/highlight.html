<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Kufi;font-weight:900;src:url(fonts/noto-kufi-arabic-arabic-900-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Kufi;font-weight:900;src:url(fonts/noto-kufi-arabic-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Taj;font-weight:800;src:url(fonts/tajawal-arabic-800-normal.woff2)}
@font-face{font-family:Taj;font-weight:700;src:url(fonts/tajawal-arabic-700-normal.woff2)}
@font-face{font-family:TajL;font-weight:800;src:url(fonts/tajawal-latin-800-normal.woff2)}
html,body{margin:0;background:#612AFF}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Pixelat highlight stories (static, 1080x1920). ?s=<story id>
const W=1080,H=1920,CY=900;
const V='#612AFF',L='#E0FF38',N='#232347',WH='#FFFFFF';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const img={};
const load=(k,src)=>new Promise(r=>{const i=new Image();i.onload=()=>{img[k]=i;r()};i.src=src});

function setFont(font){ctx.font=font;ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='alphabetic'}
// headline: Noto Kufi 900 + navy outline + extrude; shrinks to stay under 960 px
function HL(text,color,size=92){
  let it;do{setFont(`900 ${size}px Kufi`);const m=ctx.measureText(text);const o=Math.round(size*.07),e=Math.round(size*.10);
    it={kind:'hl',text,size,color,o,e,asc:m.actualBoundingBoxAscent,
      w:m.actualBoundingBoxLeft+m.actualBoundingBoxRight+2*o,h:m.actualBoundingBoxAscent+m.actualBoundingBoxDescent+2*o+e};size-=4}
  while(it.w>940&&size>56);return it;
}
function drawHL(it,cx,top){const by=top+it.o+it.asc;setFont(`900 ${it.size}px Kufi`);
  ctx.lineJoin='miter';ctx.miterLimit=2;ctx.lineWidth=it.o*2;ctx.fillStyle=N;ctx.strokeStyle=N;
  for(let k=it.e;k>=1;k--){ctx.strokeText(it.text,cx,by+k);ctx.fillText(it.text,cx,by+k)}
  ctx.strokeText(it.text,cx,by);ctx.fillStyle=it.color;ctx.fillText(it.text,cx,by)}
function raised(x,y,w,h,fill,o=6,e=12){ctx.fillStyle=N;ctx.fillRect(x-o,y-o,w+2*o,h+2*o+e);ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}
// ink box of a Tajawal string
function inkTX(text,size,weight=800){setFont(`${weight} ${size}px Taj, TajL`);const m=ctx.measureText(text);
  return {w:m.actualBoundingBoxLeft+m.actualBoundingBoxRight,asc:m.actualBoundingBoxAscent,h:m.actualBoundingBoxAscent+m.actualBoundingBoxDescent}}
function drawTXc(text,size,color,cx,cy,weight=800){const t=inkTX(text,size,weight);ctx.fillStyle=color;ctx.fillText(text,cx,cy-t.h/2+t.asc)}

// items laid out as one centred column; gap numbers are tuned so the measured INK gaps are 40/80
const item=(h,draw)=>({h,draw});
const hlItem=it=>item(it.h,top=>drawHL(it,540,top));
function card(text,size=46){const t=inkTX(text,size);const w=Math.min(960,t.w+96),h=t.h+70;
  return item(h+12,top=>{raised(540-w/2,top,w,h,WH);drawTXc(text,size,N,540,top+h/2)})}
function button(text){const t=inkTX(text,54);const w=t.w+120,h=112;
  return item(h+14,top=>{const x=Math.round(540-w/2);ctx.fillStyle=N;ctx.fillRect(x-7,top-7,w+14,h+14+14);ctx.fillStyle=L;ctx.fillRect(x,top,w,h);drawTXc(text,54,N,540,top+h/2)})}
function image(k,w){const i=img[k];const h=Math.round(i.height*w/i.width);
  return item(h,top=>{ctx.imageSmoothingQuality='high';ctx.drawImage(i,540-w/2,top,w,h)})}
function column(list){ // list: [item, gap, item, gap, item…]
  let total=0;list.forEach(x=>total+=typeof x==='number'?x:x.h);
  let y=Math.round(CY-total/2);list.forEach(x=>{if(typeof x==='number')y+=x;else{x.draw(Math.round(y));y+=x.h}})}

function bg(){ctx.fillStyle=V;ctx.fillRect(0,0,W,H);
  // faint pixel grid (navy at low alpha), as in the brief band
  ctx.globalAlpha=.10;ctx.fillStyle=N;for(let x=0;x<W;x+=60)ctx.fillRect(x,0,3,H);for(let y=0;y<H;y+=60)ctx.fillRect(0,y,W,3);ctx.globalAlpha=1}

// ---- a generic picture (sun + hills), drawn at a given cell size: coarse = "مبكسلة", fine = sharp ----
function picture(x,y,w,h,cell){
  const sky=V,sun=L,hill=N,hill2=WH;
  for(let py=0;py<h;py+=cell)for(let px=0;px<w;px+=cell){
    const u=(px+cell/2)/w,v=(py+cell/2)/h;let col=sky;
    if(Math.hypot(u-.70,(v-.30)*h/w)<.13)col=sun;
    if(v>.62+.10*Math.sin(u*5.2+.4))col=hill2;
    if(v>.70+.12*Math.sin(u*3.4+2.2))col=hill;
    ctx.fillStyle=col;ctx.fillRect(x+px,y+py,Math.min(cell,w-px),Math.min(cell,h-py));
  }}
function pictures(){const pw=360,ph=280,gap=140,h=ph+12;
  return item(h,top=>{
    const xr=540+gap/2,xl=540-gap/2-pw; // RTL: right = before, left = after
    raised(xr,top,pw,ph,WH,8,12);picture(xr,top,pw,ph,40);
    raised(xl,top,pw,ph,WH,8,12);picture(xl,top,pw,ph,4);
    // pixel arrow pointing left
    ctx.fillStyle=N;const ay=top+ph/2,u=10;
    const A=["....X......","...XX......","..XXXXXXXXX",".XXXXXXXXXX","..XXXXXXXXX","...XX......","....X......"];
    const ax=Math.round(540-A[0].length*u/2),aty=Math.round(ay-A.length*u/2);
    A.forEach((r,ri)=>[...r].forEach((ch,ci)=>{if(ch==='X'){ctx.fillStyle=N;ctx.fillRect(ax+ci*u-4,aty+ri*u-4,u+8,u+12)}}));
    A.forEach((r,ri)=>[...r].forEach((ch,ci)=>{if(ch==='X'){ctx.fillStyle=L;ctx.fillRect(ax+ci*u,aty+ri*u,u,u)}}));
  })}

// ---- 2x2 service tiles ----
function tiles(list){const tw=440,th=360,gx=40,gy=64;
  return item(th*2+gy+12,top=>{
    list.forEach((s,i)=>{const col=i%2,row=Math.floor(i/2);
      const x=col===0?540+gx/2:540-gx/2-tw; // RTL: first tile on the right
      const y=top+row*(th+gy);raised(x,y,tw,th,V,6,12);
      const ic=img[s.icon];const maxW=240,maxH=170;const k=Math.min(maxW/ic.width,maxH/ic.height);
      const iw=Math.round(ic.width*k),ih=Math.round(ic.height*k);
      const t=inkTX(s.label,52);const blockH=ih+40+t.h;const y0=y+(th-blockH)/2;
      ctx.imageSmoothingQuality='high';ctx.drawImage(ic,x+tw/2-iw/2,y0,iw,ih);
      ctx.fillStyle=WH;setFont('800 52px Taj');ctx.fillText(s.label,x+tw/2,y0+ih+40+t.asc);
    })})}

const STORIES={
  'about-1':()=>column([image('lockup',760),69,hlItem(HL('كل شي يطلع بالشاشة',WH)),40,hlItem(HL('إحنا نسويه',L)),87,card('فيديوهات · مواقع · تطبيقات · ترويج')]),
  'about-2':()=>column([hlItem(HL('الصورة مبكسلة؟',WH)),87,pictures(),89,hlItem(HL('عدنا كل بكسل محسوب',L)),87,card('يعني دقة واهتمام بكل تفصيلة')]),
  'about-3':()=>column([hlItem(HL('شنو نسوي؟',WH)),85,tiles([{icon:'video',label:'فيديوهات'},{icon:'web',label:'مواقع'},{icon:'apps',label:'تطبيقات'},{icon:'promo',label:'ترويج'}]),93,button('راسلنا بالخاص')]),
};
(async()=>{
  await Promise.all(['900 40px Kufi','800 40px Taj','800 40px TajL'].map(x=>document.fonts.load(x,'بكسلات 0123؟')));
  await Promise.all([load('lockup','../brand/logo-lockup-transparent.png'),load('video','assets/svc/video-film.png'),
    load('web','assets/svc/web.png'),load('apps','assets/svc/apps.png'),load('promo','assets/svc/promo.png')]);
  const s=new URLSearchParams(location.search).get('s')||'about-1';
  bg();STORIES[s]();window.ready=true;
})();
</script></body></html>
