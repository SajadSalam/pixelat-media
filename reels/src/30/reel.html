<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#232347}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Reel 19 «رحلة البكسل» — motion only, no words. Portrait 0–3 s, then the frame turns to landscape.
const W=1080,H=1920,LW=1920,LH=1080,BEAT=15,TOTAL=600;
const V='#612AFF',L='#E0FF38',N='#232347',WH='#FFFFFF';
const LT='#EEEAFB',PK='#FF7AB6',CY_='#5BD1FF',AM='#FFB547';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const easeInOut=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const backOut=t=>{t=clamp(t);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const pulse=f=>Math.exp(-(f%BEAT)/3.2);
function R(g,x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function cell(g,x,y,s,col){const o=Math.max(2,Math.round(s*0.25));R(g,x-o,y-o,s+2*o,s+2*o+3,N);R(g,x,y,s,s,col)}
function raised(g,x,y,w,h,fill,o=6,e=12){R(g,x-o,y-o,w+2*o,h+2*o+e,N);R(g,x,y,w,h,fill)}

// ---------- the hero (same lime pixel character as reel 17 + daily stories) ----------
const BODY=[".XXXXXX.","XXXXXXXX","XXXXXXXX","XXXXXXXX","XXXXXXXX","XXXXXXXX",".XXXXXX.",".X....X.",".X....X."];
const BODY_JUMP=[".XXXXXX.","XXXXXXXX","XXXXXXXX","XXXXXXXX","XXXXXXXX","XXXXXXXX",".XXXXXX.","XX....XX","........"];
const HCELLS=[];BODY.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')HCELLS.push([c,r])}));
// o: {look:-1|0|1, blink, wink, jump, sx, sy}
function hero(g,cx,bottom,U,o={}){
  const sp=o.jump?BODY_JUMP:BODY;const sx=o.sx||1,sy=o.sy||1;
  g.save();g.translate(cx,bottom);g.scale(sx,sy);
  const x0=-4*U,y0=-9*U,ov=Math.max(2,Math.round(U*0.28));
  sp.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')R(g,x0+c*U-ov,y0+r*U-ov,U+2*ov,U+2*ov+4,N)}));
  sp.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')R(g,x0+c*U,y0+r*U,U,U,L)}));
  const ex=1+(o.look||0);
  // eyes: 1x2 cells, closed = 1 cell low
  [[ex,o.blink],[ex+3,o.blink||o.wink]].forEach(([c,closed])=>{if(closed)R(g,x0+c*U,y0+3*U+U*0.35,U,U*0.4,N);else R(g,x0+c*U,y0+2*U,U,2*U,N)});
  if(o.smile){R(g,x0+2*U,y0+5*U,U*4,U*0.45,N);R(g,x0+1.6*U,y0+4.6*U,U*0.5,U*0.5,N);R(g,x0+5.9*U,y0+4.6*U,U*0.5,U*0.5,N)}
  g.restore();
}

// ---------- portrait opening (0–89) ----------
const Pc=document.createElement('canvas');Pc.width=W;Pc.height=H;const pg=Pc.getContext('2d');
function phoneIcon(g,cx,cy,ang,a){
  g.save();g.globalAlpha=a;g.translate(cx,cy);g.rotate(ang);
  const u=20;R(g,-3*u-6,-5*u-6,6*u+12,10*u+12+6,N);R(g,-3*u,-5*u,6*u,10*u,L);R(g,-2*u,-4*u,4*u,7*u,N);R(g,-u/2,4*u-u/2+2,u,u*0.6,N);
  g.restore();
}
function arcArrow(g,cx,cy,r,a,prog){ // pixel arc showing a counter-clockwise turn
  g.save();g.globalAlpha=a;const steps=10;
  for(let i=0;i<=steps*prog;i++){const t=-Math.PI*0.15-(i/steps)*Math.PI*0.7;cell(g,Math.round(cx+Math.cos(t)*r-10),Math.round(cy+Math.sin(t)*r-10),20,WH)}
  if(prog>=1){const t=-Math.PI*0.85,x=cx+Math.cos(t)*r,y=cy+Math.sin(t)*r;cell(g,x-34,y-6,20,WH);cell(g,x-10,y+18,20,WH)}
  g.restore();
}
function drawPortrait(g,f){
  R(g,0,0,W,H,N);
  const p=pulse(f);
  if(f>=0){g.globalAlpha=0.07*p;for(let y=0;y<H;y+=72)for(let x=0;x<W;x+=72)if(((x+y)/72)%2===0)R(g,x,y,72,72,V);g.globalAlpha=1}
  // the lone pixel: pops in on frame 0, beats with the music
  const s0=f<4?backOut(f/4):1, s=36*s0*(1+0.35*p);
  cell(g,540-s/2,960-s/2,s,L);
  // rotate-your-phone cue (no words)
  if(f>=40){const a=clamp((f-40)/5)*(f>=80?clamp(1-(f-80)/4):1);
    const ang=-easeInOut((f-52)/12)*Math.PI/2;
    phoneIcon(g,540,1330,ang,a);arcArrow(g,540,1330,150,a,clamp((f-46)/10));}
}

// ---------- landscape world (90–599): a small hero walking through a pixel world ----------
const Lc=document.createElement('canvas');Lc.width=LW;Lc.height=LH;const lg=Lc.getContext('2d');
const U=20, FLOOR=860, HSX=560;           // hero cell size, ground line, hero's screen x while walking
const SPR=[[".XX..XX.","XXXXXXXX","XXXXXXXX","..XXXX..","..XXXX..","..XXXX..","..XXXX..","........"],
 ["........","..XXXX..",".XXXXXX.",".XXXXXX.","XXXXXXXX","XXX.....","........","........"],
 ["..XXXX..",".X....X.","XXXXXXXX","XXXXXXXX","XXXXXXXX","XXXXXXXX","XXXXXXXX","........"]];
const BOTTLE=["..NNN...","..NLN...",".NNNNN..","NAAAAAN.","NAWAAAN.","NAWAAAN.","NAAAAAN.",".NNNNN.."];
function sprite(g,sp,x,y,u,col){
  sp.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')R(g,x+c*u-2,y+r*u-2,u+4,u+4,N)}));
  sp.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='.')return;R(g,x+c*u,y+r*u,u,u,ch==='X'?col:ch==='N'?N:ch==='A'?AM:ch==='W'?WH:L)}));
}
// walking legs
const WALK=[[".XX..X..",".X...XX."],["..X..XX.",".XX...X."]];
function heroW(g,cx,bottom,u,o){
  if(o.walk===undefined){hero(g,cx,bottom,u,o);return}
  const body=BODY.slice(0,7).concat(WALK[o.walk]);
  const x0=cx-4*u,y0=bottom-9*u,ov=Math.max(2,Math.round(u*0.28));
  body.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')R(g,x0+c*u-ov,y0+r*u-ov,u+2*ov,u+2*ov+4,N)}));
  body.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')R(g,x0+c*u,y0+r*u,u,u,L)}));
  const ex=1+(o.look||0);[ex,ex+3].forEach(c=>R(g,x0+c*u,y0+2*u,u,2*u,N));
}
// ---- scenery ----
const TREE=["...XXXX...","..XXXXXX..",".XXWXXXXX.","XXXXXXXXXX","XXXXXXWXXX","XXXXXXXXXX",".XXXXXXXX.","..XXXXXX..","....TT....","....TT....","....TT....","...TTTT..."];
function tree(g,x,bottom,u,grow){
  const h=TREE.length;g.save();g.translate(x,bottom);g.scale(1,grow);
  TREE.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch!=='.')R(g,(c-5)*u-3,(r-h)*u-3,u+6,u+6,N)}));
  TREE.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='.')return;R(g,(c-5)*u,(r-h)*u,u,u,ch==='T'?V:ch==='W'?'#F2FF9A':L)}));
  g.restore();
}
function cloud(g,x,y,n){const s=40;R(g,x-4,y-4,n*s+8,s+8,N);R(g,x+s-4,y-s-4,(n-2)*s+8,s+8,N);R(g,x,y,n*s,s,WH);R(g,x+s,y-s,(n-2)*s,s,WH)}
const TREES=[];{const r=rng(31);for(let x=-200;x<4400;x+=230+Math.floor(r()*170))TREES.push({x,u:r()<0.5?14:18})}
const CLOUDS=[];{const r=rng(12);for(let x=-300;x<4400;x+=380+Math.floor(r()*260))CLOUDS.push({x,y:150+Math.floor(r()*300),n:3+Math.floor(r()*3)})}
const BUSH=[];{const r=rng(5);for(let x=0;x<4600;x+=420+Math.floor(r()*300))BUSH.push(x)}

// ---- path: world x of the hero, and the camera ----
const STOP1=860, STOP2=1660, STOP3=2460, S1=STOP1+520, S2=STOP2+500, S3=STOP3+520;
function heroX(f){
  const seg=[[190,220,560,STOP1],[265,315,STOP1,STOP2],[355,405,STOP2,STOP3],[455,515,STOP3,STOP3+840]];
  let x=560;for(const [a,b,x0,x1] of seg){if(f>=b)x=x1;else if(f>=a){x=x0+(x1-x0)*(f-a)/(b-a);break}}
  return x;
}
const walking=f=>(f>=190&&f<220)||(f>=265&&f<315)||(f>=355&&f<405)||(f>=455&&f<515);
const hsx=f=>HSX+(900-HSX)*easeInOut((f-500)/40);
const camX=f=>heroX(f)-hsx(f);

// ---- stations (world objects built from falling pixels) ----
const WIN={w:760,h:520};
const Sc=document.createElement('canvas');Sc.width=WIN.w;Sc.height=WIN.h;
(function site(g){const w=WIN.w,h=WIN.h;
  R(g,0,0,w,h,WH);R(g,0,0,w,44,N);[L,WH,V].forEach((cc,i)=>R(g,w-30-i*24,15,14,14,cc));R(g,40,12,w-160,20,'#3A3A66');
  R(g,0,44,w,56,N);R(g,w-78,58,48,28,L);[0,1,2].forEach(i=>R(g,w-190-i*110,66,80,12,WH));
  R(g,24,116,w-48,140,V);R(g,w-330,146,280,26,WH);R(g,w-250,186,200,16,WH);R(g,w-210,218,160,22,L);
  const cw=(w-48-2*20)/3;[0,1,2].forEach(i=>{const x=w-24-(i+1)*cw-i*20,y=276;
    R(g,x,y,cw,150,LT);const u=Math.floor(cw*0.5/8);sprite(g,SPR[i],Math.round(x+cw/2-4*u),y+28,u,[L,PK,CY_][i]);
    R(g,x+cw-130,y+166,110,14,N);R(g,x+cw-90,y+190,70,12,V);R(g,x+12,y+214,cw-24,22,V);});
})(Sc.getContext('2d'));
const SB1={w:500,h:342}; // billboard size on screen
const B1=[];{const r=rng(9);const bs=40;for(let y=0;y<WIN.h;y+=bs)for(let x=0;x<WIN.w;x+=bs){const band=Math.min(4,Math.floor(y/WIN.h*5));B1.push({x,y,t:207+band*9+(WIN.w-x)/WIN.w*4+r()*2})}}
const ICONS=[V,L,PK,CY_,AM,N,L,V,CY_,PK,AM,V];
function appIcon(g,x,y,s,col,k){raised(g,x,y,s,s,col,3,5);const u=s/8,gl=col===L||col===AM||col===CY_?N:WH;
  const G=[[[2,2,4,4]],[[3,1,2,6],[1,3,6,2]],[[2,2,4,1],[2,4,4,1],[2,6,3,1]],[[2,2,4,4],[3,3,2,2,col]],[[2,5,1,1],[3,4,1,1],[4,3,1,1],[5,2,1,1]],[[1,3,6,2]]][k%6];
  G.forEach(q=>R(g,x+q[0]*u,y+q[1]*u,q[2]*u,q[3]*u,q[4]||gl));}
function heartP(g,cx,cy,u,col){const P=[".XX.XX.","XXXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."];
  P.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')R(g,cx-3.5*u+c*u-3,cy-3*u+r*u-3,u+6,u+6,N)}));
  P.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')R(g,cx-3.5*u+c*u,cy-3*u+r*u,u,u,col)}));}
function posts(g,cx,top,bottom,gap){[cx-gap,cx+gap-16].forEach(x=>{R(g,x-4,top,24,bottom-top,N);R(g,x,top,16,bottom-top,'#3A3A66')})}
function station1(g,f){ // website billboard
  if(f<200)return;const cx=S1,bw=SB1.w,bh=SB1.h,x=cx-bw/2,y=FLOOR-120-bh;
  posts(g,cx,y+bh,FLOOR,150);raised(g,x,y,bw,bh,N,7,12);
  const k=bw/WIN.w;for(const b of B1){if(f<b.t)continue;const d=(b.t+7-f)>0?Math.pow((b.t+7-f)/7,2)*-300:0;
    g.drawImage(Sc,b.x,b.y,40,40,x+b.x*k,y+b.y*k+d,40*k+0.5,40*k+0.5)}
}
function station2(g,f){ // phone with app icons
  if(f<290)return;const cx=S2,pw=230,ph=420,x=cx-pw/2,y=FLOOR-ph-30;
  const a=easeOut((f-290)/10);const yy=y-(1-a)*500;
  R(g,cx-60,FLOOR-34,120,34,N);R(g,cx-52,FLOOR-30,104,26,'#3A3A66');
  raised(g,x,yy,pw,ph,N,7,12);R(g,x+12,yy+12,pw-24,ph-24,'#F4F1FF');R(g,cx-30,yy+18,60,10,N);
  for(let i=0;i<12;i++){const st=300+i*4;if(f<st)continue;const s=52*(f-st<5?backOut((f-st)/5):1);const col=i%3,row=Math.floor(i/3);
    appIcon(g,x+24+col*64+26-s/2,yy+48+row*72+26-s/2,s,ICONS[i],i)}
  if(f>=348)for(let i=0;i<4;i++)appIcon(g,x+22+i*48,yy+ph-62,36,[V,L,PK,CY_][i],i+2);
}
function adCard(g,x,y,w,h,f){
  raised(g,x,y,w,h,WH,7,12);R(g,x+18,y+16,40,40,L);hero(g,x+38,y+52,4,{});R(g,x+70,y+22,120,12,N);R(g,x+70,y+42,80,10,'#8A7FB8');
  R(g,x+18,y+72,w-36,240,V);const b=Math.sin(f/7)*6;sprite(g,BOTTLE,x+w/2-88,y+110+b,22,AM);
  const liked=f>=410;const hp=liked&&(f-410)%15<5?1.25:1;
  g.save();g.translate(x+44,y+352);g.scale(hp,hp);heartP(g,0,0,6,liked?L:WH);g.restore();
  R(g,x+90,y+336,34,30,N);R(g,x+95,y+341,24,16,WH);R(g,x+140,y+344,30,6,N);R(g,x+152,y+334,6,26,N);
  R(g,x+18,y+390,w-90,12,N);R(g,x+18,y+412,w-150,10,'#8A7FB8');
}
function station3(g,f){ // ad post on posts
  if(f<380)return;const cx=S3,w=330,h=440,x=cx-w/2,y=FLOOR-90-h;
  posts(g,cx,y+h,FLOOR,90);
  const fl=easeOut((f-380)/12);g.save();g.translate(cx,y+h/2);g.scale(Math.max(0.01,fl),1);g.translate(-cx,-(y+h/2));adCard(g,x,y,w,h,f);g.restore();
  for(let k=0;k<5;k++){const s=410+k*15;if(f<s)continue;const t=(f-s)/30;if(t>1)continue;heartP(g,x+44+Math.sin(t*6+k)*26,y+352-t*380,5,k%2?L:WH)}
}
// climax: the sky turns brand violet, growing from the hero, banded on the beats
const FT=[];{const g=60,maxd=Math.hypot(1400,800);for(let y=0;y<LH;y+=g)for(let x=0;x<LW;x+=g){const d=Math.hypot(x+30-HSX-140,y+30-760)/maxd;const band=Math.min(4,Math.floor(d*5));FT.push({x,y,t:465+band*15+(d*5-band)*8})}}

function heroState(f){
  const st={b:FLOOR,o:{look:1}};
  if(f>=165&&f<172){st.o.blink=1;st.o.look=0}
  else if(f>=172&&f<178)st.o.look=-1;else if(f>=178&&f<190)st.o.look=1;
  if(walking(f)){st.o.walk=Math.floor(f/4)%2;st.b-=(Math.floor(f/4)%2)*4}
  // watch each station build: little hops on the beats
  const watch=(f>=225&&f<262)||(f>=318&&f<352)||(f>=408&&f<452);
  if(watch){const k=(f-225)%15;if(k<6){st.b-=Math.sin(k/6*Math.PI)*24;st.o.jump=1}}
  if(f>=410&&f<455)st.o.smile=1;
  if(f>=515){st.o={look:0,smile:1};if(f>=552&&f<556)st.o.blink=1;if(f>=566)st.o.wink=1;
    const k=(f-570)%30;if(f>=570&&k<8){st.b-=Math.sin(k/8*Math.PI)*40;st.o.jump=1;st.o.smile=1}}
  return st;
}
function drawLand(f){
  const g=lg;const cam=camX(f);
  // sky: navy, turning violet from the hero outwards at the climax
  const done=f>=540;R(g,0,0,LW,LH,done?V:N);
  if(f>=460&&!done)for(const t of FT){const k=(f-t.t)/6;if(k<=0)continue;const s=Math.ceil(60*Math.min(1,k));R(g,t.x+30-s/2,t.y+30-s/2,s,s,k<1?L:V)}
  const p=pulse(f);g.globalAlpha=0.06*p;for(let y=0;y<FLOOR;y+=60)for(let x=0;x<LW;x+=60)if(((x+y)/60)%2===0)R(g,x,y,60,60,done?N:V);g.globalAlpha=1;
  // world builds in on the beats (90–130): clouds slide, trees grow, ground lays left→right
  const wb=t=>clamp((f-t)/8);
  for(const cl of CLOUDS){const sx=cl.x-cam*0.3+f*0.4;const xx=((sx%2600)+2600)%2600-300;const a=wb(96+((xx/LW)*16|0));
    if(a>0)cloud(g,xx-(1-a)*120,cl.y,cl.n)}
  for(const t of TREES){const sx=t.x-cam*0.7;if(sx<-200||sx>LW+200)continue;const a=easeOut(wb(100+((Math.max(0,sx)/LW)*20|0)));if(a>0)tree(g,sx,FLOOR,t.u,a)}
  // stations (in world space, 1:1 with the ground)
  g.save();g.translate(-cam,0);station1(g,f);station2(g,f);station3(g,f);g.restore();
  // ground
  for(let x=-((cam%40)+40)%40-40;x<LW+40;x+=40){const wx=x+cam;const a=wb(92+((Math.max(0,x)/LW)*18|0));if(a<=0)continue;
    R(g,x,FLOOR+(1-a)*200,40,LH-FLOOR,N);R(g,x+2,FLOOR+(1-a)*200+2,36,12,L);if(((wx/40)|0)%3===0)R(g,x+8,FLOOR+40,14,14,'#2E2E5C')}
  for(const bx of BUSH){const sx=bx-cam*1.0;if(sx<-100||sx>LW+100)continue;if(wb(104)<=0)continue;R(g,sx-4,FLOOR-34,88,38,N);R(g,sx,FLOOR-30,80,30,L);R(g,sx+16,FLOOR-46,48,20,N);R(g,sx+20,FLOOR-42,40,16,L)}
  // ---- hero ----
  if(f<165){const x0=HSX-4*U,y0=FLOOR-9*U;
    HCELLS.forEach(([c,r],i)=>{let tx=x0+c*U,ty=y0+r*U;
      if(c===3&&r===4){const t=easeInOut((f-90)/12);const s=36+(U-36)*t;cell(g,960-18+(tx-960+18)*t,540-18+(ty-540+18)*t,s,L);return}
      const beat=Math.floor(i/HCELLS.length*4),land=114+beat*15+(i%5),st=land-10;if(f<st)return;
      const t=clamp((f-st)/10);cell(g,tx+((i*137)%500-250)*(1-t),-60+(ty+60)*t*t,U,L)});
  } else {const hs=heroState(f);heroW(g,hsx(f),hs.b,U,hs.o)}
  // finale arrow toward the caption (no words)
  if(f>=572&&Math.floor((f-572)/8)%2===0){const ax=hsx(f)+130,ay=FLOOR-100;for(let i=0;i<3;i++)cell(g,ax+i*26,ay,20,L);for(let i=1;i<3;i++){cell(g,ax+52-i*26,ay-i*26,20,L);cell(g,ax+52-i*26,ay+i*26,20,L)}}
}

function draw(f){
  ctx.setTransform(1,0,0,1,0,0);R(ctx,0,0,W,H,N);
  if(f<84){drawPortrait(ctx,f);return}
  if(f<96){const ang=easeInOut((f-84)/12)*Math.PI/2;const sh=f>=90?14*(1-(f-90)/6):0;
    ctx.save();ctx.translate(540+Math.sin(f*2.7)*sh,960+Math.cos(f*3.1)*sh);ctx.rotate(ang);
    if(f<90){drawPortrait(pg,f);ctx.drawImage(Pc,-540,-960)}else{drawLand(f);ctx.drawImage(Lc,-960,-540)}
    ctx.restore();return}
  drawLand(f);ctx.save();ctx.translate(1080,0);ctx.rotate(Math.PI/2);ctx.drawImage(Lc,0,0);ctx.restore();
}
window.draw=draw;window.TOTAL=TOTAL;window.ready=true;
</script></body></html>
